<div class="profile-container" *ngIf="user; else loadingTpl">
  <h2 class="title">👤 Mon Profil</h2>

  <div class="profile-card">
    <div class="image-container">
      <img
        [src]="user.imageUrl || 'assets/default-profile.png'"
        alt="Photo de profil"
        class="profile-image"
      />
      <input
        type="file"
        (change)="onFileSelected($event)"
        accept="image/*"
        class="input-file"
      />
    </div>

    <form (ngSubmit)="onSubmit()" class="profile-form" #profileForm="ngForm">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          [(ngModel)]="user.username"
          #username="ngModel"
        />
        <div class="error" *ngIf="username.invalid && username.touched">
          Ce champ est obligatoire
        </div>
      </div>

      <div class="form-group">
        <label for="email">Adresse Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          [(ngModel)]="user.email"
          #email="ngModel"
        />
        <div class="error" *ngIf="email.invalid && email.touched">
          Email invalide ou vide
        </div>
      </div>

      <div class="form-group">
        <label for="bio">Bio</label>
        <textarea
          id="bio"
          name="bio"
          rows="4"
          [(ngModel)]="user.bio"
          placeholder="Parlez un peu de vous..."
        ></textarea>
      </div>

      <div class="buttons">
        <button
          type="submit"
          class="btn-save"
          [disabled]="profileForm.invalid"
          title="Enregistrer les modifications"
        >
          💾 Enregistrer
        </button>
        <button
          type="button"
          class="btn-delete"
          (click)="onDelete()"
          title="Supprimer le profil"
        >
          🗑️ Supprimer le profil
        </button>
      </div>
    </form>
  </div>
</div>

<ng-template #loadingTpl>
  <div class="loading">
    <p>Chargement du profil...</p>
  </div>
</ng-template>
